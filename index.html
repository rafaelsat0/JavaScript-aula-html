<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
</head>
<script>
    // Código a ser executado se a condição for verdadeira
        // == igual 
        // === estritamente igual
        // != diferente
        // !== estritamente diferente
        // > maior que
        // < menor que
        // >= maior ou igual
        // <= menor ou igual
        // && e
        // || ou

     let alunoAprovado = true;
    let elementoResultadoAluno = document.getElementById("alunoReprovado");

    if (alunoAprovado) {
       elementoResultadoAluno.innerHTML = "Aluno aprovado com sucesso!";

       elementoResultadoAluno.style.color = "green";
        
    } else{
        elementoResultadoAluno.innerHTML = "Aluno reprovado!";

        elementoResultadoAluno.style.color = "red";
    }
</script>
<body>
    <h1 id="alunoReprovado">Atividade 2</h1>
</body>
</html>
